<!doctype html>
<!-- Banner source. Fonts (SIL Open Font License, from Google Fonts): Sora, JetBrains Mono.
     Put Sora.ttf and JetBrainsMono.ttf next to this file and screenshot at 1280x640, scale 2, with ?theme=dark and ?theme=light.
     The counts line comes from `python3 scripts/count_claims.py` (skills, gotchas). Re-render when they change. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Sora; src: url(Sora.ttf); font-weight: 100 800; }
@font-face { font-family: Mono; src: url(JetBrainsMono.ttf); font-weight: 100 800; }
:root { --bg:#0B0C11; --ink:#E8E4DC; --card:#161722; --line:#2B2D3C; --mute:#9395A3; --signal:#DC000C; }
:root[data-theme="light"] { --bg:#E8E4DC; --ink:#161722; --card:#F6F3EC; --line:#C9C3B6; --mute:#5E606C; --signal:#DC000C; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; background: var(--bg); color: var(--ink); overflow: hidden; }
.wrap { display: grid; grid-template-columns: 1fr 510px; gap: 44px; align-items: center; height: 100%; padding: 0 72px; }
h1 { font-family: Sora; font-weight: 700; font-size: 112px; line-height: 0.98; letter-spacing: -0.055em; }
p { font-family: Sora; font-weight: 400; font-size: 40px; line-height: 1.3; letter-spacing: -0.015em; margin-top: 36px; }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 30px; }
.row { display: grid; grid-template-columns: 70px 40px 1fr; align-items: center; height: 100px; font-family: Mono; font-size: 30px; }
.row + .row { border-top: 1.5px solid var(--line); }
.k { font-family: Mono; font-size: 25px; font-weight: 500; }
.sw { width: 28px; height: 28px; border-radius: 7px; }
.raw .sw { background: var(--signal); }
.raw .v { color: var(--mute); text-decoration: line-through; text-decoration-thickness: 3px; }
.raw .k { color: var(--mute); }
.tok .sw { background: var(--signal); }
.tok .v { font-weight: 600; }
.counts { font-family: Mono; font-weight: 700; font-size: 34px; margin-top: 30px; padding-left: 4px; letter-spacing: -0.01em; }
</style></head>
<body>
<div class="wrap">
  <div>
    <h1>Figma<br>Maxxing</h1>
    <p>Agent skills for real Figma<br>files, by Thiago Xikota.</p>
  </div>
  <div>
    <div class="card">
      <div class="row raw"><span class="k">Fill</span><span class="sw"></span><span class="v">#DC000C</span></div>
      <div class="row tok"><span class="k">Fill</span><span class="sw"></span><span class="v">color/brand/signal</span></div>
    </div>
    <div class="counts">8 skills · 90 gotchas</div>
  </div>
</div>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
</body></html>
