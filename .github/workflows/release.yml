name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Tag matches every version field, CHANGELOG has the section
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - run: python -m unittest discover -s tests
      - run: python scripts/check_api.py --strict
      - run: python scripts/count_claims.py --check

  publish:
    name: Build, attest and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # sign the provenance attestation with Sigstore
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build the zips twice and compare the bytes
        run: |
          python scripts/build_dist.py --out dist
          python scripts/build_dist.py --out "$RUNNER_TEMP/rebuild"
          diff dist/SHA256SUMS "$RUNNER_TEMP/rebuild/SHA256SUMS"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create the GitHub release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "dist/figma-maxxing-${version}.intoto.jsonl"
          python scripts/release_notes.py "$version" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
