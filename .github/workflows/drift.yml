name: Drift
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typings:
    name: Plugin API names vs the latest @figma/plugin-typings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # open or update the drift issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: check_api.py --version latest
        shell: bash
        run: python scripts/check_api.py --version latest 2>&1 | tee "$RUNNER_TEMP/report.txt"
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift: the skills disagree with the latest @figma/plugin-typings"
          {
            echo "The weekly check against the newest typings release failed: $RUN_URL"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  links:
    name: Link rot in Markdown and llms.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # open or update the link rot issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail: true
          output: lychee/report.md
          args: >-
            --no-progress --include-fragments --accept '200..=299,429'
            --remap 'https://raw\.githubusercontent\.com/thiagoxikota/figma-maxxing/main/(.*) file://${{ github.workspace }}/$1'
            --remap 'https://github\.com/thiagoxikota/figma-maxxing/(?:blob|tree)/main/([^#]*) file://${{ github.workspace }}/$1'
            './**/*.md' llms.txt
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Link rot: the weekly link check failed"
          { echo "Run: $RUN_URL"; echo; cat lychee/report.md; } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
