name: Something depends on the author's setup
description: A step, path or tool in a skill that does not exist on your machine.
title: "Setup: "
labels: [portability]
body:
  - type: markdown
    attributes:
      value: |
        These skills were written on one machine and then made portable. If a step assumes a path, a tool or a habit you do not have, that is a bug in the skill. Thanks for reporting it.
  - type: input
    id: skill
    attributes:
      label: Skill and file
      placeholder: skills/figma-preflight/SKILL.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the skill asked for, and what happened
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Your environment
      placeholder: macOS 15, Claude Code 2.1, figma-console-mcp 1.40.9
    validations:
      required: true
